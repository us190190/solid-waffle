<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>LangGraph Research Assistant — Idea 1</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: Inter, system-ui, sans-serif;
        }

        body {
            margin: 0;
            background: #0f172a;
            color: #e2e8f0;
            display: flex;
            height: 100vh;
        }

        #sidebar {
            width: 340px;
            background: #1e293b;
            border-right: 1px solid #334155;
            display: flex;
            flex-direction: column;
        }

        #sidebar h2 {
            padding: 16px;
            margin: 0;
            border-bottom: 1px solid #334155;
            font-size: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #sidebar h2 button {
            background: #334155;
            color: #e2e8f0;
            border: none;
            padding: 4px 8px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
        }

        #history {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }

        .hist-item {
            padding: 10px 12px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            margin-bottom: 8px;
            cursor: pointer;
        }

        .hist-item:hover {
            border-color: #38bdf8;
        }

        .hist-item .q {
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .hist-item .meta {
            font-size: 11px;
            color: #94a3b8;
            margin-top: 4px;
        }

        #main {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        #header {
            padding: 18px 24px;
            border-bottom: 1px solid #334155;
            background: #1e293b;
        }

        #header h1 {
            margin: 0;
            font-size: 18px;
        }

        #header p {
            margin: 6px 0 0;
            color: #94a3b8;
            font-size: 13px;
        }

        #badge {
            display: inline-block;
            background: #0ea5e9;
            color: white;
            padding: 2px 8px;
            border-radius: 999px;
            font-size: 11px;
            margin-left: 8px;
        }

        #content {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
        }

        #inputRow {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
        }

        #query {
            flex: 1;
            padding: 14px;
            border-radius: 10px;
            border: 1px solid #334155;
            background: #1e293b;
            color: #e2e8f0;
            font-size: 14px;
        }

        #query:focus {
            outline: none;
            border-color: #38bdf8;
        }

        button.primary {
            background: #0ea5e9;
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
        }

        button.primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        label.chk {
            font-size: 12px;
            color: #94a3b8;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        #status {
            font-size: 12px;
            color: #38bdf8;
            min-height: 18px;
            margin-bottom: 8px;
        }

        #answer {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 20px;
            min-height: 180px;
            white-space: pre-wrap;
            line-height: 1.6;
        }

        #answer h3 {
            margin-top: 0;
        }

        a {
            color: #38bdf8;
        }

        #docs {
            margin-top: 16px;
        }

        .doc {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 10px 12px;
            margin-bottom: 8px;
        }

        .doc title {
            display: block;
        }

        .pill {
            font-size: 11px;
            background: #334155;
            padding: 2px 6px;
            border-radius: 4px;
            color: #cbd5e1;
        }

        #health {
            font-size: 11px;
            color: #94a3b8;
        }
    </style>
</head>
<body>
<div id="sidebar">
    <h2>History
        <button onclick="clearHistory()">Clear</button>
    </h2>
    <div id="history"></div>
</div>
<div id="main">
    <div id="header">
        <h1>LangGraph Research Assistant <span id="badge">Idea 1 — Sequential</span></h1>
        <p>DuckDuckGo search → Gemini Flash summarize → Gemini Flash cite &nbsp;|&nbsp; <span
                id="health">checking...</span></p>
        <p style="color:#64748b;">LangGraph: StateGraph with 3 nodes + SQLite history. No API key? Mock mode still
            works.</p>
    </div>
    <div id="content">
        <div id="inputRow">
            <input id="query" placeholder="e.g. What is LangGraph and how does it differ from LangChain?"
                   onkeydown="if(event.key==='Enter') doResearch()"/>
            <button id="btn" class="primary" onclick="doResearch()">Research</button>
        </div>
        <label class="chk"><input type="checkbox" id="streamChk"/> Stream via LangGraph astream (SSE)</label>
        <div id="status"></div>
        <div id="answer">Results will appear here. Ask a question above.</div>
        <div id="docs"></div>
    </div>
</div>
<script>
    const qEl = document.getElementById('query');
    const ansEl = document.getElementById('answer');
    const docsEl = document.getElementById('docs');
    const statusEl = document.getElementById('status');
    const histEl = document.getElementById('history');
    const healthEl = document.getElementById('health');
    const btn = document.getElementById('btn');

    async function health() {
        try {
            const r = await fetch('/api/health');
            const j = await r.json();
            healthEl.textContent = j.gemini_configured ? `Gemini ✓ (${j.model})` : `Mock mode (set GOOGLE_API_KEY for Gemini Flash) • ${j.model}`;
            healthEl.style.color = j.gemini_configured ? '#22c55e' : '#f59e0b';
        } catch {
            healthEl.textContent = 'offline';
        }
    }

    health();

    function renderMarkdown(text) {
        // minimal: escape + linkify citations [1]
        return text.replace(/\[(\d+)\]/g, '<span class="pill">[$1]</span>')
            .replace(/\n/g, '<br/>')
            .replace(/### (.*)/g, '<h3>$1</h3>')
            .replace(/\*\*(.*?)\*\*/g, '<b>$1</b>');
    }

    async function loadHistory() {
        const r = await fetch('/api/history?limit=50');
        const j = await r.json();
        histEl.innerHTML = j.items.map(it => `
    <div class="hist-item" onclick="loadItem(${it.id})">
      <div class="q">${it.query}</div>
      <div class="meta">${new Date(it.created_at).toLocaleString()} • ${it.documents_count} docs</div>
    </div>
  `).join('') || '<div style="padding:12px;color:#64748b;font-size:13px">No history yet.</div>';
    }

    loadHistory();

    async function loadItem(id) {
        const r = await fetch('/api/history/' + id);
        const j = await r.json();
        ansEl.innerHTML = renderMarkdown(j.final_answer);
        docsEl.innerHTML = '<h4>Sources</h4>' + j.documents.map((d, i) => `
    <div class="doc"><b>${i + 1}. ${d.title}</b><br/><a href="${d.url}" target="_blank">${d.url}</a><br/><span style="font-size:13px;color:#94a3b8">${d.content.slice(0, 220)}...</span></div>
  `).join('') + `<div style="margin-top:12px;color:#94a3b8;font-size:12px">Summary: ${j.summary.slice(0, 400)}</div>`;
        statusEl.textContent = `Loaded #${id} — ${j.query}`;
    }

    async function clearHistory() {
        if (!confirm('Clear all history?')) return;
        await fetch('/api/history', {method: 'DELETE'});
        loadHistory();
        ansEl.textContent = 'Cleared.';
        docsEl.innerHTML = '';
    }

    async function doResearch() {
        const query = qEl.value.trim();
        if (query.length < 3) return alert('Enter at least 3 characters');
        const useStream = document.getElementById('streamChk').checked;
        btn.disabled = true;
        ansEl.textContent = 'Running LangGraph: search → summarize → cite ...';
        docsEl.innerHTML = '';
        statusEl.textContent = 'Starting...';

        if (useStream) {
            // SSE mode
            const es = new EventSource('/api/research/stream?q=' + encodeURIComponent(query));
            let lastState = null;
            es.onmessage = (e) => {
                if (e.data === '[DONE]') {
                    es.close();
                    btn.disabled = false;
                    statusEl.textContent = 'Done (stream). Saving to history...';
                    finishSave(query);
                    return;
                }
                try {
                    const state = JSON.parse(e.data);
                    lastState = state;
                    if (state.documents) statusEl.textContent = `Searched: ${state.documents.length} docs found`;
                    if (state.summary) {
                        statusEl.textContent = 'Summarized ✓ — citing...';
                        ansEl.innerHTML = renderMarkdown(state.summary);
                    }
                    if (state.final_answer) {
                        ansEl.innerHTML = renderMarkdown(state.final_answer);
                        docsEl.innerHTML = (state.documents || []).map((d, i) => `<div class="doc"><b>${i + 1}. ${d.title}</b><br/><a href="${d.url}" target="_blank">${d.url}</a></div>`).join('');
                    }
                } catch {
                }
            };
            es.onerror = () => {
                es.close();
                btn.disabled = false;
                statusEl.textContent = 'Stream error, trying non-stream...';
                doResearchNonStream(query);
            };
            return;
        }
        await doResearchNonStream(query);
    }

    async function doResearchNonStream(query) {
        try {
            statusEl.textContent = 'Searching DuckDuckGo ...';
            const r = await fetch('/api/research', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({query})
            });
            if (!r.ok) {
                const t = await r.text();
                throw new Error(t);
            }
            const j = await r.json();
            statusEl.textContent = `Done #${j.id} — ${j.documents.length} docs`;
            ansEl.innerHTML = renderMarkdown(j.final_answer);
            docsEl.innerHTML = '<h4>Sources</h4>' + j.documents.map((d, i) => `
      <div class="doc"><b>${i + 1}. ${d.title}</b><br/><a href="${d.url}" target="_blank">${d.url}</a><br/><span style="font-size:13px;color:#94a3b8">${(d.content || '').slice(0, 240)}...</span></div>
    `).join('') + `<div style="margin-top:12px;color:#94a3b8;font-size:13px"><b>Summary</b><br/>${j.summary.slice(0, 500)}</div>`;
            loadHistory();
        } catch (e) {
            ansEl.textContent = 'Error: ' + e.message;
            statusEl.textContent = 'Failed';
        } finally {
            btn.disabled = false;
        }
    }

    async function finishSave(query) {
        // after stream, also persist via POST to get history entry
        try {
            await fetch('/api/research', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({query})
            });
            loadHistory();
        } catch {
        }
    }
</script>
</body>
</html>
